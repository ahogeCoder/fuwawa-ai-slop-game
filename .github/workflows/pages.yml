name: Deploy WebGL to GitHub Pages

# docs/ に置いた WebGL ビルドをそのまま配信する（Unityライセンス不要）
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Ensure nojekyll
        run: touch docs/.nojekyll

      # 古い WebGL 成果物（ハッシュ付きファイル）は使われないので削除して
      # アーティファクトのサイズ膨胀を防ぐ
      - name: Clean stale WebGL artifacts
        run: |
          cd docs/Build
          # index.html が参照しているファイル名を抽出（例: abc123...unityweb）
          grep -oE 'buildUrl \+ "/[^"]+"' ../index.html \
            | sed -E 's#.*buildUrl \+ "/##; s#"$##' \
            | sort -u > /tmp/keep.txt || true
          echo "--- keeping ---"; cat /tmp/keep.txt
          for f in *; do
            if ! grep -qxF "$f" /tmp/keep.txt 2>/dev/null; then
              echo "removing stale file: $f"
              rm -f "$f"
            fi
          done
          echo "--- remaining ---"; ls -la

      - uses: actions/configure-pages@v5
        with:
          # Pages が未有効でも自動で有効化する
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4
